paths:
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: data/artifacts

serve:
  top_k: 10

defaults:
  valence: 0.5
  energy: 0.5

train:
  always_train: false      # 필요 시에만 재학습 (train.sh로 제어)
  skip_ranking: true       # 기본은 CF(SVD)만 학습해 빠르게 준비
  max_rows: 50000          # 대용량 방지용 학습 샘플 상한(0이면 전체)
